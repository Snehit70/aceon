<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aceon Icon Preview</title>
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #050505;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .preview {
            display: grid;
            gap: 1rem;
            justify-items: center;
        }

        .icon {
            width: 180px;
            height: 180px;
            border: 1px solid rgba(230, 46, 45, 0.4);
            background: #050505;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
            overflow: hidden;
        }

        .icon img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .label {
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="preview">
        <div class="icon">
            <img src="/icon.png" alt="Aceon logo preview">
        </div>
        <div class="label">Aceon</div>
    </div>
</body>
</html>
